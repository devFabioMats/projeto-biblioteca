<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/style.css">
    <title>Login - Biblioteca</title>
</head>

<body>
    <main>
        <div class="login-container">
            <div class="login-logo">
                <h1>BB</h1>
                <p>Biblioteca Boa Leitura</p>
            </div>
            <form class="form-login">
                <input class="login-input" type="email" id="email" placeholder="Email" required>
                <input class="login-input" type="password" id="password" placeholder="Senha" required>
                <button class="login-submit" type="submit" id="login-button">ENTRAR</button>
            </form>
        </div>
    </main>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/auth.js"></script>
</body>

</html>
